services:
  hisab:
    build: .
    env_file: .env
    volumes:
      - ${HISAB_CONFIG:-./config.yaml}:/app/config.yaml:ro
      - ${HISAB_VAULT:-./vault}:/app/vault   # your ledger — open this folder in Obsidian; HISAB_VAULT=./sample-vault to demo on the sample
      - hisab-data:/app/data        # offset, message store, media
    restart: unless-stopped
volumes:
  hisab-data:
