# Copy to config.yaml. Everything here is safe to commit; secrets live in .env.

ledger:
  path: ./vault            # folder holding hisab.md, accounts.md, rules.md, the quarter files
  template: personal       # personal | shop — used only when the folder is empty and setup runs
  currency: PKR            # the default until setup; the currency answered in setup wins after

timezone: Asia/Karachi     # IANA name; export-ledger file names and captions use this clock

model:
  provider: auto           # auto: OPENROUTER_API_KEY if set, else GEMINI_API_KEY · or pin openrouter | gemini
  id: openai/gpt-4o-mini   # any OpenRouter model id; decided by testing the setup chat and Roman Urdu entries
  gemini_id: gemini-3.8-flash  # used instead of id when the provider is gemini and id is an OpenRouter vendor/model id
  base_url: null           # any OpenAI-compatible endpoint; null = OpenRouter. e.g. https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: null        # env var holding the key for that endpoint; null = OPENROUTER_API_KEY
  provider_pin: null       # e.g. "openai" to keep requests on one provider (OpenRouter provider routing)

transcription:
  provider: auto           # auto (same key rule as the model) | openrouter | gemini
  model: openai/whisper-1  # openrouter provider
  gemini_model: gemini-2.5-flash
  # api_key_env: null      # env var holding the transcription key; null = the provider's own (OPENROUTER_API_KEY / GEMINI_API_KEY)
  language: null           # null = auto; a code like 'ur' pins it (OpenRouter's language field, a hint to Gemini)

memory:
  window_turns: 20         # rolling context from the message store
  keep_days: 30            # message store retention

whatsapp:
  poll_timeout: 20         # seconds, max 25
  chunk_chars: 3500        # replies longer than this are split (WhatsApp caps at 4096)
  rate_limits:             # WhatsApp Agent Platform manual v1 §6 — each its own rolling 60s window, scoped per agent
    window_seconds: 60     # fixed at 60 by wa-agent; any other value is logged and ignored
    messages_per_min: 12   # POST /agent/v1/messages
    statuses_per_min: 12   # POST /agent/v1/statuses (read receipts, typing)
    updates_per_min: 15    # GET /agent/v1/updates (the poll loop)
    media_per_min: 12      # /agent/v1/media — POST, GET and DELETE each get their own 12/min counter
