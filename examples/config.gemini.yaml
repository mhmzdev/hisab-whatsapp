# Alternative: Google Gemini through its OpenAI-compatible endpoint, with google-genai for voice notes.
# cp examples/config.gemini.yaml config.yaml   and put GEMINI_API_KEY in .env

ledger:
  path: ./vault
  template: personal
  currency: PKR

model:
  id: gemini-3.8-flash
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY
  provider_pin: null

transcription:
  provider: gemini
  gemini_model: gemini-2.5-flash

memory:
  window_turns: 20
  keep_days: 30

whatsapp:
  poll_timeout: 20
  chunk_chars: 3500

state:
  path: ./data
