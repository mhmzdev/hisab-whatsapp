# Event / production config: one OpenRouter key for the model and voice transcription.
# cp examples/config.openrouter.yaml config.yaml   and put OPENROUTER_API_KEY in .env

ledger:
  path: ./vault
  template: personal
  currency: PKR

model:
  provider: openrouter           # pinned: never falls back to GEMINI_API_KEY
  id: openai/gpt-4.1-mini        # tools verified on OpenRouter; run tests/bakeoff.sh to compare candidates
  base_url: null                 # null = OpenRouter
  api_key_env: null              # null = OPENROUTER_API_KEY
  provider_pin: null

transcription:
  provider: openrouter
  model: openai/whisper-1        # alternatives: openai/gpt-4o-transcribe, openai/whisper-large-v3
  language: null                 # null = auto-detect (English, Urdu, Roman Urdu)

memory:
  window_turns: 20
  keep_days: 30

whatsapp:
  poll_timeout: 20
  chunk_chars: 3500

state:
  path: ./data
